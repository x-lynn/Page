name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies for task-manager-vue
        working-directory: ./task-manager-vue
        run: npm install
        
      - name: Build task-manager-vue
        working-directory: ./task-manager-vue
        run: npm run build
        
      - name: Prepare deployment directory
        run: |
          mkdir -p deploy/task-manager-vue
          cp -r ./task-manager-vue/dist/* deploy/task-manager-vue/ || true
          echo '<!DOCTYPE html><html><head><title>Page Projects</title><style>body{font-family:Arial,sans-serif;margin:40px}ul{list-style:none;padding:0}li{margin:10px 0}a{color:#0366d6;text-decoration:none;font-size:18px}a:hover{text-decoration:underline}</style></head><body><h1>Projects</h1><ul><li><a href="/Page/task-manager-vue/">Task Manager Vue</a></li></ul></body></html>' > deploy/index.html
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
