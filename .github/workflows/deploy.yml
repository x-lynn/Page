name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Give workflows permission to write repository contents so the action
      # can push to the `gh-pages` branch using the built-in GITHUB_TOKEN.
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./task-manager-vue
        run: npm install
        
      - name: Build
        working-directory: ./task-manager-vue
        run: npm run build
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Use the built-in token which is provided to workflows.
          # Make sure repository Actions permissions allow workflows to write pages (settings -> Actions -> General).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./task-manager-vue/dist
          destination_dir: ./task-manager-vue
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

